name: Claude PR Review (reusable)

on:
  workflow_call:
    inputs:
      orchestrator-model:
        description: Model for the orchestrator (dispatches subagents — Sonnet is sufficient)
        required: false
        default: claude-sonnet-4-6
        type: string
      max-turns:
        description: Max orchestrator turns
        required: false
        default: 25
        type: number
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      MAGICFIT_METER_TOKEN:
        description: Supabase anon key for the central claude_call_costs table. Optional — recording is skipped if missing.
        required: false

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Check override label
        id: override
        run: |
          set -euo pipefail
          if jq -e '(.pull_request.labels // []) | map(.name) | index("claude-review-override")' "$GITHUB_EVENT_PATH" > /dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::claude-review-override label present — skipping review, check passes."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.override.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch review prompt from org repo
        if: steps.override.outputs.skip != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/pr-review.md \
            "https://raw.githubusercontent.com/magicfit/.github/main/prompts/pr-review.md"
          wc -l /tmp/pr-review.md

      - name: Load prompt into output
        if: steps.override.outputs.skip != 'true'
        id: prompt
        run: |
          {
            echo 'content<<PROMPT_EOF'
            cat /tmp/pr-review.md
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude review
        if: steps.override.outputs.skip != 'true'
        id: claude
        # Graceful degradation: do NOT fail the job when the action errors.
        # Most common cause is Anthropic spend exhausted / org cost-meter
        # refusing the OIDC token exchange (manifests as a 401 on App-token
        # exchange). A follow-up step inspects `steps.claude.outcome` and
        # posts a skip comment on the PR so a human knows to retry or
        # proceed manually. Bug-class failures still surface in the
        # Actions tab — they just don't block merge.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --model ${{ inputs.orchestrator-model }}
            --max-turns ${{ inputs.max-turns }}
            --allowed-tools "Bash,Read,Write,Edit,Glob,Grep,Task,WebFetch"
          prompt: ${{ steps.prompt.outputs.content }}

      - name: Notify skip on action failure
        # Fires only when the Claude step ran (no override) AND failed. Posts
        # a single PR comment so reviewers know the automated pass was
        # skipped and have a clear retry path. Never fails the workflow.
        if: steps.override.outputs.skip != 'true' && steps.claude.outcome == 'failure'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const prNumber = context.issue.number;
            if (!prNumber) return;
            const runUrl = process.env.RUN_URL;
            const body = [
              ':warning: **Automated Claude review skipped.**',
              '',
              `The review action couldn't complete — most commonly because Anthropic spend is exhausted or the org cost-meter declined the OIDC token exchange. Details: [Actions run](${runUrl}).`,
              '',
              'To retry: comment `@claude review` once spend resets. To bypass: apply the `claude-review-override` label.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });

      - name: Read blocking-issues marker
        if: steps.override.outputs.skip != 'true'
        id: check
        run: |
          set -euo pipefail
          # When the Claude step failed (spend exhaustion, OIDC denial, etc.)
          # the marker file won't exist — fall through to has-blocking-issues=false
          # so the workflow doesn't enforce against an absent verdict.
          if [ -f /tmp/claude-blocking-issues ] && [ "$(cat /tmp/claude-blocking-issues)" = "true" ]; then
            echo "has-blocking-issues=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-blocking-issues=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record cost to meter
        # Fire-and-forget; always runs (even on Claude failure / override skip)
        # so the meter has data for failed/skipped runs too. Never fails the workflow.
        if: always() && steps.override.outputs.skip != 'true'
        continue-on-error: true
        env:
          METER_URL: https://mjjzzbriqvdyfycqajvh.supabase.co/rest/v1/claude_call_costs
          METER_TOKEN: ${{ secrets.MAGICFIT_METER_TOKEN }}
          ORCH_MODEL: ${{ inputs.orchestrator-model }}
          BLOCKING: ${{ steps.check.outputs.has-blocking-issues }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${METER_TOKEN:-}" ]; then
            echo "MAGICFIT_METER_TOKEN not set — skipping cost record."
            exit 0
          fi
          EXECUTION_FILE="/home/runner/work/_temp/claude-execution-output.json"
          if [ ! -f "$EXECUTION_FILE" ]; then
            echo "Execution file not found at $EXECUTION_FILE — Claude step may have failed before completing."
            exit 0
          fi

          # The Claude Code SDK writes its execution output as a JSON ARRAY
          # of message objects (not newline-delimited JSON, as earlier code
          # assumed — caused `jq: Cannot index array with string "type"`).
          # Iterate with `.[]` to handle the array; fall back to treating it
          # as a single object if the file shape changes in a future SDK
          # release.
          RESULT_JSON=$(jq -c '(if type == "array" then .[] else . end) | select(.type == "result")' "$EXECUTION_FILE" | tail -1)
          if [ -z "$RESULT_JSON" ]; then
            echo "No result line in execution file — skipping cost record."
            exit 0
          fi

          COST_USD=$(echo "$RESULT_JSON" | jq -r '.total_cost_usd // 0')
          DURATION_MS=$(echo "$RESULT_JSON" | jq -r '.duration_ms // 0')
          NUM_TURNS=$(echo "$RESULT_JSON" | jq -r '.num_turns // 0')
          DENIALS=$(echo "$RESULT_JSON" | jq -r '.permission_denials_count // 0')

          # Token counts aren't in the SDK summary line — we record 0 here
          # and rely on cost_usd for spend analysis. Future iteration could
          # parse per-message usage from the full execution log.
          PAYLOAD=$(jq -n \
            --arg model "$ORCH_MODEL" \
            --arg repo "$REPO" \
            --arg pr "$PR_NUMBER" \
            --arg head_sha "$HEAD_SHA" \
            --arg blocking "$BLOCKING" \
            --argjson cost "$COST_USD" \
            --argjson duration "$DURATION_MS" \
            --argjson turns "$NUM_TURNS" \
            --argjson denials "$DENIALS" \
            '{
              model: $model,
              api_key_label: "pr-review",
              service: "magicfit-github-actions",
              job_kind: "pr-review",
              input_tokens: 0,
              output_tokens: 0,
              cache_read_tokens: 0,
              cache_creation_tokens: 0,
              cost_usd: $cost,
              job_ref: ($repo + "/pull/" + $pr),
              duration_ms: $duration,
              metadata: {
                head_sha: $head_sha,
                num_turns: $turns,
                permission_denials_count: $denials,
                blocking_issues: ($blocking == "true")
              }
            }')

          echo "Posting cost record (cost=\$$COST_USD, turns=$NUM_TURNS, blocking=$BLOCKING)..."
          HTTP_CODE=$(curl -sS -o /tmp/meter-response.txt -w "%{http_code}" \
            -X POST "$METER_URL" \
            -H "apikey: $METER_TOKEN" \
            -H "Authorization: Bearer $METER_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "$PAYLOAD" || echo "000")

          if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "204" ]; then
            echo "::notice::Cost record posted (HTTP $HTTP_CODE) — \$$COST_USD"
          else
            echo "::warning::Meter POST returned HTTP $HTTP_CODE: $(cat /tmp/meter-response.txt | head -c 200)"
          fi

      - name: Enforce blocking issues
        if: steps.override.outputs.skip != 'true' && steps.check.outputs.has-blocking-issues == 'true'
        run: |
          echo "::error::Claude flagged blocking issues. Resolve them, or apply the 'claude-review-override' label to bypass."
          exit 1
