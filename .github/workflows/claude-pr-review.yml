name: Claude PR Review (reusable)

on:
  workflow_call:
    inputs:
      orchestrator-model:
        description: Model for the orchestrator
        required: false
        default: claude-sonnet-4-6
        type: string
      max-turns:
        description: Max orchestrator turns
        required: false
        default: 40
        type: number
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - run: echo "reusable workflow alive"
