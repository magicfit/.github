name: Claude PR Review (reusable)

on:
  workflow_call:
    inputs:
      orchestrator-model:
        description: Model for the orchestrator
        required: false
        default: claude-sonnet-4-6
        type: string
      max-turns:
        description: Max orchestrator turns
        required: false
        default: 40
        type: number
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Check override label
        id: override
        run: |
          set -euo pipefail
          if jq -e '(.pull_request.labels // []) | map(.name) | index("claude-review-override")' "$GITHUB_EVENT_PATH" > /dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::claude-review-override label present"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Echo
        if: steps.override.outputs.skip != 'true'
        run: echo "skip=${{ steps.override.outputs.skip }}"
